[pytest]
# Test discovery.
#
# testpaths is the SUITE -- unit + contract, the two directories that are
# green with no server and no model, which is what /test-suite runs. The live
# checks (smoke, eval, e2e) are scripts with their own runners, never swept
# by a bare `pytest`; an explicit path argument overrides testpaths.
testpaths = tests/unit tests/contract
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (no server required) - fast, isolated tests
    slow: Slow tests (> 1 second) - performance or stress tests
    mlx_perf: MLX performance optimization tests (requires MLX and model)

# Output options
console_output_style = progress
addopts =
    --strict-markers
    --tb=short
    -ra

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=heylook_llm --cov-report=html
