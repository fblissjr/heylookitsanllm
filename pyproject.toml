[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heylookitsanllm"
dynamic = ["version"]
description = "On-Device Multimodal LLM API server for local LLM models, using MLX"
authors = [{ name = "Fred Bliss" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

# Current as of 2026-08-18. A floor is the version this repo actually resolves
# and runs its suite against, not the oldest one that might work -- an ancient
# floor lets a fresh resolve elsewhere pick something never tested here. uv.lock
# pins the exact versions. The MLX stack is darwin-only -- the sys_platform
# markers keep a base install resolvable elsewhere.
dependencies = [
    # MLX / model stack (darwin-only)
    "mlx>=0.32.1; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
    "mlx-vlm>=0.6.15; sys_platform == 'darwin'",
    "transformers>=5.15.0",    # Floor only; the real constraint is the [tool.uv] override below
    # REQUIRED, and deliberately NOT derivable from the declared dep graph -- do
    # not "clean this up" because `uv tree` shows nothing depending on it
    # (checked 2026-08-18, ~505MB of venv, tempting to cut for exactly that
    # reason). transformers declares torch only under `extra == "torch"`, but
    # transformers/generation/logits_process.py does a BARE module-level
    # `import torch`, reached eagerly by `import mlx_vlm` -> AutoProcessor ->
    # configuration_utils -> generation.configuration_utils. So `import mlx_vlm`
    # imports torch, and without it the MLX provider will not import at all.
    # Verify by TRACING the import (a meta_path hook on "torch"), never by
    # reading dependency metadata. Also needed by four mlx-vlm per-model modules
    # (falcon_ocr, lfm2_vl, glm_ocr, sam3d_body) and, via its own PEP 723 inline
    # deps, by scripts/jspace_convert_lens.py.
    "torch>=2.13.0",
    # Web framework + server
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4",
    # Data + serialization
    "duckdb>=1.5.5",           # App-DB store: conversations, notebooks, presets, settings
    "orjson>=3.12.0",          # Fast JSON serialization -- upstream ijl/orjson, never a fork
    "tomli-w>=1.2.0",          # Authoritative for models.toml WRITES (values/layout/order)
    "tomlkit>=0.15.1",         # STRICTLY read-only: comment extraction for toml_comments
    "numpy>=2.5.2",
    # Images / IO / system
    "Pillow>=12.3.0",
    "requests>=2.34.2",        # utils.load_image URL fetch + scripts/benchmark.py
    "psutil>=7.2.2",           # System metrics (RAM, CPU)
    # Performance. Guarded imports, folded into core so `uv sync` gives a fast
    # server. xxhash + PyTurboJPEG were dropped 2026-08-18: both were imported
    # only to flip a status flag (no hash call, no decode call anywhere), and
    # PyTurboJPEG additionally wanted a system libjpeg-turbo it never used.
    "uvloop>=0.22.1; sys_platform != 'win32'",   # Unix-only; excluded on Windows
    "cachetools>=7.1.7",       # TTLCache behind optimizations.fast_image.ImageCache
]

# Dev tooling. Installed by default on `uv sync` (skip with --no-dev); not
# part of a PyPI install.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",       # TestClient / API contract tests + tests/integration
    "pyyaml>=6.0.3",       # scripts/export_openapi.py --yaml
    "rich>=15.0.0",        # scripts/benchmark.py console output
    "py-spy>=0.4.2",       # Sampling profiler
]
# No build/twine: `uv build` and `uv publish` cover both, and this repo is
# uv-only (dropped 2026-08-18 -- nothing referenced them).

[project.urls]
Homepage = "https://github.com/fblissjr/heylookitsanllm"
Repository = "https://github.com/fblissjr/heylookitsanllm"
Issues = "https://github.com/fblissjr/heylookitsanllm/issues"

[project.scripts]
heylookllm = "heylook_llm.server:main"

# ── Packaging ───────────────────────────────────────────────────────────────
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"heylook_llm.data.samplers" = ["*.toml"]
"heylook_llm.data.services" = ["*.template"]

[tool.setuptools.dynamic]
version = { attr = "heylook_llm.__version__" }

# ── uv resolver config ──────────────────────────────────────────────────────
[tool.uv]
# Replaces every transformers constraint in the graph (strips the upper bounds
# mlx-lm/mlx-vlm pin). Keep equal to the [project.dependencies] floor.
override-dependencies = ["transformers>=5.15.0"]

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "contract: Contract tests (TestClient, no running server)",
    "integration: Integration tests (requires server or model)",
    "mlx_perf: MLX performance optimization tests (requires MLX and model)",
    "slow: Slow tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
