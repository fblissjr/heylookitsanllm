[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heylookitsanllm"
dynamic = ["version"]
description = "On-Device Multimodal LLM API server for local LLM models, using MLX"
authors = [{ name = "Fred Bliss" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

# Everything the server + CLI need to fully work. `uv sync` (no flags) installs
# this plus the `dev` group below -- there are deliberately NO optional extras
# to remember. The MLX stack is git-sourced (see [tool.uv.sources]) and
# darwin-only; the `sys_platform` markers keep a base install resolvable on
# Linux/Windows even though inference itself is Apple-Silicon-only.
dependencies = [
    # MLX / model stack (git-sourced; darwin-only)
    "mlx>=0.22.0; sys_platform == 'darwin'",
    "mlx-lm>=0.21.0; sys_platform == 'darwin'",
    "mlx-vlm>=0.3.11; sys_platform == 'darwin'",
    "transformers>=5.13.1",    # Floor only; the real constraint is the [tool.uv] override below
    "torch==2.13.0",           # Exact pin (needed transitively by transformers/mlx-vlm; keep it reproducible)
    # Web framework + server
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    # Data + serialization
    "duckdb>=1.5.2",           # App-DB store: conversations, notebooks, presets, settings
    "orjson>=3.9.15",          # Fast JSON serialization
    "pyyaml>=6.0.1",
    "tomli-w>=1.0.0",
    "numpy>=1.24.0",
    # Images / IO / system
    "Pillow>=10.0.1",
    "requests>=2.31.0",
    "psutil>=5.9.0",           # System metrics (RAM, CPU)
    # Performance (guarded imports, but the server's fast paths expect them:
    # turbojpeg = multipart JPEG decode, uvloop = event loop, xxhash/cachetools
    # = image + cache hashing). Folded into core so `uv sync` gives a fast server.
    "xxhash>=3.4.1",
    "PyTurboJPEG>=1.7.5",
    "cachetools>=5.3.2",
    "uvloop>=0.19.0; sys_platform != 'win32'",   # Unix-only; excluded on Windows
    "tomlkit>=0.15.1",
]

# Developer tooling. uv installs this group by DEFAULT on `uv sync`, so a plain
# clone-and-sync gets tests + build + profiling without any extra flags. A PyPI
# `pip install heylookitsanllm` gets only the runtime deps above (groups are
# not published), which is exactly right for end users.
[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27",         # TestClient / API contract tests
    "build>=1.0.0",        # sdist/wheel builds
    "twine>=6.0.0",        # PyPI upload
    "rich>=13.0.0",        # scripts/benchmark.py console output
    "py-spy>=0.3.14",      # Sampling profiler
]

[project.urls]
Homepage = "https://github.com/fblissjr/heylookitsanllm"
Repository = "https://github.com/fblissjr/heylookitsanllm"
Issues = "https://github.com/fblissjr/heylookitsanllm/issues"

[project.scripts]
heylookllm = "heylook_llm.server:main"

# ── Packaging ───────────────────────────────────────────────────────────────
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"heylook_llm.data.samplers" = ["*.toml"]
"heylook_llm.data.services" = ["*.template"]

[tool.setuptools.dynamic]
version = { attr = "heylook_llm.__version__" }

# ── uv resolver config ──────────────────────────────────────────────────────
[tool.uv]
# An override REPLACES every constraint on transformers across the whole graph,
# which is the point: it strips the upper bounds mlx-lm/mlx-vlm pin so the
# resolver always takes the latest 5.x (5.x has a video_processing_auto.py
# NoneType bug when torchvision is absent -- patched in mlx_provider.py). Kept
# equal to the [project.dependencies] floor so the two don't appear to disagree.
override-dependencies = ["transformers>=5.13.1"]

# GENERATED by scripts/update_deps.py -- do not hand-edit. A package appears
# here only while its channel is "latest" (see [tool.heylook.deps] below), and
# it always carries an explicit `rev` so the lock is reproducible. Plain uv has
# no command that pins HEAD into pyproject, which is why the script exists.
[tool.uv.sources]
mlx-lm = { git = "https://github.com/ml-explore/mlx-lm", rev = "254d153fdeb6f150edd4fc5a54f9828638481fa8" }
mlx-vlm = { git = "https://github.com/Blaizzy/mlx-vlm", rev = "321514d633342f079f97fc7b80aa787249217116" }

# ── Upstream channels ───────────────────────────────────────────────────────
# Where the fast-moving upstreams come from. `scripts/update_deps.py` reads
# this, resolves the channel, and writes the resolved pin back -- so this file
# always states what you are actually running.
#
#   stable   published releases: PyPI for the Python packages, the newest
#            `b<N>` release tag for llama.cpp. The default for anything not
#            named in `overrides`.
#   latest   tip of the tracked branch, pinned to the exact commit it resolved
#            to (a [tool.uv.sources] entry above, or `rev` under
#            [tool.heylook.llama-cpp]).
#
# NB: `uv sync` installs the Python packages but CANNOT build llama.cpp -- a
# llama.cpp bump is always an explicit `uv run scripts/update_deps.py llama.cpp`.
[tool.heylook.deps]
# `stable` is the SHIPPED default, and it stays that way: nobody should end up
# tracking an unreviewed upstream HEAD because a config file they never read
# said so. Opting into `latest` is a thing you do knowingly, by name.
channel = "stable"
# Overrides are a standing, informed choice for THIS checkout -- they say
# "resolve these two from git HEAD when I ask", not "update automatically".
# Nothing moves without naming the package and confirming the plan, so the
# opt-in is re-stated at every bump; this just avoids re-deciding the policy.
# Kept on `latest` because the published releases genuinely lag: as of
# 2026-08-10 mlx-vlm's newest tag is v0.6.9 while git is 0.6.12, and
# docs/architecture/ecosystem_strategy.md records mlx-lm shipping fixes as
# commits rather than releases. Delete a key to put that package on releases.
# NB: a fresh clone is unaffected either way -- `uv sync` installs the exact
# revs in uv.lock, and only running update_deps.py consults these channels.
overrides = { mlx-lm = "latest", mlx-vlm = "latest" }

# Where "latest" comes from. Kept here rather than only in [tool.uv.sources]
# so the URL survives a switch to the stable channel (which deletes the source
# entry) and the switch back is still one flag.
[tool.heylook.deps.git]
mlx-lm = { git = "https://github.com/ml-explore/mlx-lm", branch = "main" }
mlx-vlm = { git = "https://github.com/Blaizzy/mlx-vlm", branch = "main" }

# llama.cpp: cloned and BUILT by scripts/update_deps.py (it is a C++ binary, not
# a Python package -- nothing about it is in uv.lock). The build settings are
# owned by the script; `extra_cmake_args` is the escape hatch.
#
# `dir` is EMPTY on purpose. The checkout then goes to a fixed location under
# your home directory (`.heylook/llama.cpp`) -- OUTSIDE this repo, because
# upstream C++ source plus a multi-GB build tree are things heylook must never
# ship or package, and because a fixed path is one that docs, error messages
# and every machine can name identically. Set `dir` to put it elsewhere
# (relative paths resolve against the repo root); $HEYLOOK_LLAMA_CPP_DIR wins
# over both.
[tool.heylook.llama-cpp]
git = "https://github.com/ggml-org/llama.cpp"
branch = "master"
dir = ""
targets = ["llama-server"]
rev = "b10354"
extra_cmake_args = []

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "contract: Contract tests (TestClient, no running server)",
    "integration: Integration tests (requires server or model)",
    "mlx_perf: MLX performance optimization tests (requires MLX and model)",
    "slow: Slow tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
