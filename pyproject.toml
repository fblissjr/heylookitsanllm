[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heylookitsanllm"
dynamic = ["version"]
description = "On-Device Multimodal LLM API server for local LLM models, using MLX"
authors = [{ name = "Fred Bliss" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

# Current as of 2026-08-12. Floors track published releases; uv.lock pins the
# exact versions. The MLX stack is darwin-only -- the sys_platform markers keep
# a base install resolvable elsewhere.
dependencies = [
    # MLX / model stack (darwin-only)
    "mlx>=0.32.0; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
    "mlx-vlm>=0.6.13; sys_platform == 'darwin'",
    "transformers>=5.13.1",    # Floor only; the real constraint is the [tool.uv] override below
    "torch>=2.13.0",           # Floor (needed transitively by transformers/mlx-vlm)
    # Web framework + server
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    # Data + serialization
    "duckdb>=1.5.2",           # App-DB store: conversations, notebooks, presets, settings
    "orjson>=3.9.15",          # Fast JSON serialization
    "tomli-w>=1.0.0",
    "numpy>=1.24.0",
    # Images / IO / system
    "Pillow>=10.0.1",
    "requests>=2.31.0",
    "psutil>=5.9.0",           # System metrics (RAM, CPU)
    # Performance (guarded imports, but the server's fast paths expect them:
    # turbojpeg = multipart JPEG decode, uvloop = event loop, xxhash/cachetools
    # = image + cache hashing). Folded into core so `uv sync` gives a fast server.
    "xxhash>=3.4.1",
    "PyTurboJPEG>=1.7.5",
    "cachetools>=5.3.2",
    "uvloop>=0.19.0; sys_platform != 'win32'",   # Unix-only; excluded on Windows
    "tomlkit>=0.15.1",
]

# Dev tooling. Installed by default on `uv sync` (skip with --no-dev); not
# part of a PyPI install.
[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27",         # TestClient / API contract tests + tests/integration
    "pyyaml>=6.0.1",       # scripts/export_openapi.py --yaml
    "build>=1.0.0",        # sdist/wheel builds
    "twine>=6.0.0",        # PyPI upload
    "rich>=13.0.0",        # scripts/benchmark.py console output
    "py-spy>=0.3.14",      # Sampling profiler
]

[project.urls]
Homepage = "https://github.com/fblissjr/heylookitsanllm"
Repository = "https://github.com/fblissjr/heylookitsanllm"
Issues = "https://github.com/fblissjr/heylookitsanllm/issues"

[project.scripts]
heylookllm = "heylook_llm.server:main"

# ── Packaging ───────────────────────────────────────────────────────────────
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"heylook_llm.data.samplers" = ["*.toml"]
"heylook_llm.data.services" = ["*.template"]

[tool.setuptools.dynamic]
version = { attr = "heylook_llm.__version__" }

# ── uv resolver config ──────────────────────────────────────────────────────
[tool.uv]
# Replaces every transformers constraint in the graph (strips the upper bounds
# mlx-lm/mlx-vlm pin). Keep equal to the [project.dependencies] floor.
override-dependencies = ["transformers>=5.13.1"]

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "contract: Contract tests (TestClient, no running server)",
    "integration: Integration tests (requires server or model)",
    "mlx_perf: MLX performance optimization tests (requires MLX and model)",
    "slow: Slow tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
